f"/><circle cx="200" cy="164" r="3" fill="#fff" opacity=".75"/></g><path d="M53 204V183C53 101 118 48 200 48S347 101 347 183V204" fill="none" stroke="#74142d" stroke-width="13" stroke-linecap="round"/><g fill="#74142d"><rect x="35" y="174" width="43" height="83" rx="20"/><rect x="322" y="174" width="43" height="83" rx="20"/></g><g fill="#d9b35b"><rect x="68" y="184" width="6" height="63" rx="3"/><rect x="326" y="184" width="6" height="63" rx="3"/></g><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M65 258H108Q116 258 117 249L126 139Q127 133 130 141L138 157Q143 166 151 161C175 158 203 161 221 170C242 181 247 225 263 246Q273 258 291 258H332" stroke="#fff" stroke-width="16"/><path d="M65 258H108Q116 258 117 249L126 139Q127 133 130 141L138 157Q143 166 151 161C175 158 203 161 221 170C242 181 247 225 263 246Q273 258 291 258H332" stroke="#921b39" stroke-width="9"/><path d="M332 258C351 258 351 282 333 282H304" stroke="#921b39" stroke-width="6"/></g><rect x="286" y="276" width="21" height="12" rx="3" fill="#74142d"/><path d="M286 282H277" stroke="#74142d" stroke-width="6" stroke-linecap="round"/><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M151 161C175 158 203 161 221 170" stroke="#d9b35b" stroke-width="7.5"/><path class="cvp-glide cvp-a" d="M151 161C175 158 203 161 221 170" pathLength="100" stroke="#fff" stroke-width="3"/></g><g class="cvp-eq cvp-a" stroke="#d9b35b" stroke-width="5" stroke-linecap="round"><path d="M172 134V142"/><path d="M186 128V142"/><path d="M200 122V142"/><path d="M214 116V142"/><path d="M228 110V142"/></g></svg></svg>